# Exclusion notes:
#   tests/input/ — golden test fixtures that must match tool output exactly
#   src/linkml_map/datamodel/ — generated by gen-pydantic, not hand-edited
#   docs/schema/ — generated by gen-doc, not hand-edited
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(tests/input/|src/linkml_map/datamodel/|docs/schema/)
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace
        exclude: ^(tests/input/|src/linkml_map/datamodel/|docs/schema/)

  # Run the ruff from uv.lock rather than a separately pinned copy, so local
  # hooks, `uv run ruff`, and CI can't drift apart.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
