site_name: "LinkML-Map"
theme:
#  name: material
  name: windmill
  features:
    - content.tabs.link
plugins:
  - search
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_toc_entry: false
            show_category_heading: false
            toc_depth: 1
  - autorefs
  - mknotebooks:
      execute: false
markdown_extensions:
- admonition
- codehilite
- pymdownx.superfences
nav:
  - Index: index.md
  - Quick Start: quickstart.md
  - Writing Specifications: writing-specs.md
  - Command-Line Reference: cli.md
  - Examples:
      - Tutorial: examples/Tutorial.ipynb
      - Metamodel Mapping: examples/MetamodelMapping.ipynb
  - Specification:
      - Data Model: schema/datamodel.md
      - Compliance Suite: specification/compliance.md
  - API:
      - Session: api/session.md
      - Transformer: api/transformer.md
      - Compiler: api/compiler.md
      - Inference: api/inference.md
      - Expressions: api/expressions.md
      - Functions: api/functions.md
      - Extensions: api/extensions.md
      # - Subsetter: api/subsetter.md
  - FAQ: faq.md
site_url: https://linkml.github.io/linkml-map/
repo_url: https://github.com/linkml/linkml-map/
